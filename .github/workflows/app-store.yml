name: Send Calls app to App Store

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: .
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_API_KEY_PATH: /tmp/asc_key.p8
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: ${{ secrets.APPLE_TEAM_TYPE || 'INDIVIDUAL' }}
      EAS_NO_VCS: 1
      EAS_BUILD_NO_EXPO_GO_WARNING: true
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install everything
        run: |
          npm install
          npm run setup || echo "Skipped Expo's broken plugin step"
          npx expo install expo-font || echo "ok"
          npx expo install expo-system-ui || echo "ok"
          node -e "for (const m of ['react','react-native','react-native-webview','expo-file-system','expo-splash-screen','expo-status-bar','expo-system-ui','expo-font','expo-symbols','react-native-safe-area-context','expo-modules-core']) { require.resolve(m + '/package.json'); console.log('ok', m); }"

      - name: Put the call page inside the app
        run: node scripts/make-web.js

      - name: Add the App Store Connect key
        run: |
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$EXPO_ASC_API_KEY_PATH"
          node -e '
            const fs = require("fs");
            const eas = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            eas.submit.production = { ios: {
              ascAppId: process.env.ASC_APP_ID,
              ascApiKeyPath: process.env.EXPO_ASC_API_KEY_PATH,
              ascApiKeyId: process.env.EXPO_ASC_KEY_ID,
              ascApiKeyIssuerId: process.env.EXPO_ASC_ISSUER_ID
            }};
            fs.writeFileSync("eas.json", JSON.stringify(eas, null, 2));
          '
        env:
          ASC_APP_ID: ${{ secrets.CALLS_ASC_APP_ID }}

      - name: Keep the upload small
        run: printf 'node_modules/\n.expo/\n/ios/\n/android/\n*.p8\n*.p12\n*.mobileprovision\n' > .easignore

      - name: Link to your Expo account
        run: eas init --force --non-interactive

      - name: Build the iPhone app (takes ~15–30 min)
        run: eas build --platform ios --profile production --non-interactive --wait

      - name: Upload to App Store Connect
        run: eas submit --platform ios --latest --profile production --non-interactive --wait
